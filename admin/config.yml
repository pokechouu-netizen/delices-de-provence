backend:
  name: git-gateway
  branch: main

media_folder: assets/catalogue
public_folder: assets/catalogue

collections:

  # ─── INFORMATIONS BOUTIQUE & POPUP ───────────────────────────────────────
  - name: "infos"
    label: "Informations boutique"
    files:
      - name: "infos"
        label: "Coordonnées, horaires & popup"
        file: "data/infos.json"
        format: json
        fields:

          - label: "Adresse"
            name: "adresse"
            widget: "string"
            hint: "Ex : 27, rue Saint-Antoine"

          - label: "Code postal"
            name: "code_postal"
            widget: "string"

          - label: "Ville"
            name: "ville"
            widget: "string"

          - label: "Téléphone fixe"
            name: "telephone_fixe"
            widget: "string"
            hint: "Ex : 09 86 53 24 10"

          - label: "Email"
            name: "email"
            widget: "string"

          - label: "Horaire — Lundi"
            name: "horaire_lundi"
            widget: "string"
            hint: "Ex : 10h–13h / 15h30–19h  ou  Fermé"

          - label: "Horaire — Mardi"
            name: "horaire_mardi"
            widget: "string"

          - label: "Horaire — Mercredi"
            name: "horaire_mercredi"
            widget: "string"

          - label: "Horaire — Jeudi"
            name: "horaire_jeudi"
            widget: "string"

          - label: "Horaire — Vendredi"
            name: "horaire_vendredi"
            widget: "string"

          - label: "Horaire — Samedi"
            name: "horaire_samedi"
            widget: "string"

          - label: "Horaire — Dimanche"
            name: "horaire_dimanche"
            widget: "string"

          - label: "Popup promotionnel"
            name: "popup"
            widget: "object"
            collapsed: false
            fields:
              - label: "Activer le popup"
                name: "actif"
                widget: "boolean"
                default: true
                hint: "Désactivez pour masquer le popup sans le supprimer"

              - label: "Message"
                name: "message"
                widget: "string"
                hint: "Texte affiché dans le popup"

              - label: "Texte du bouton"
                name: "cta_label"
                widget: "string"

              - label: "Lien du bouton"
                name: "cta_url"
                widget: "string"
                hint: "Ex : boutique.html"

              - label: "Délai d'apparition (secondes)"
                name: "delai_secondes"
                widget: "number"
                default: 5
                value_type: "int"

              - label: "Produits en bandeau défilant"
                name: "produits_bandeau"
                widget: "list"
                required: false
                hint: "Noms des produits qui défilent dans le popup. Laissez vide pour masquer le bandeau."
                field:
                  label: "Produit"
                  name: "item"
                  widget: "string"

  # ─── CONTENU DU SITE ─────────────────────────────────────────────────────
  - name: "contenu"
    label: "Contenu du site"
    files:
      - name: "contenu"
        label: "Textes, photos, galerie, presse & avis"
        file: "data/contenu.json"
        format: json
        fields:

          # ── Textes libres ──────────────────────────────────────────────────
          - label: "Textes"
            name: "textes"
            widget: "object"
            collapsed: false
            fields:
              - label: "Rue Saint-Antoine — Paragraphe 1"
                name: "rue_p1"
                widget: "text"
                hint: "Affiché sur la page Nos Incontournables, section boutique"

              - label: "Rue Saint-Antoine — Paragraphe 2"
                name: "rue_p2"
                widget: "text"
                required: false

              - label: "Qui sommes-nous — Paragraphe 1"
                name: "qsn_p1"
                widget: "text"
                hint: "Affiché sur la page Qui sommes-nous"

              - label: "Qui sommes-nous — Paragraphe 2"
                name: "qsn_p2"
                widget: "text"
                required: false

              - label: "L'Enclave des Papes"
                name: "enclave"
                widget: "text"
                required: false
                hint: "Texte affiché dans la section géographique"

          # ── Photos clés ────────────────────────────────────────────────────
          - label: "Photos"
            name: "photos"
            widget: "object"
            collapsed: true
            fields:
              - label: "Photo principale (hero accueil)"
                name: "hero"
                widget: "image"
                required: false

              - label: "Photo terrasse / devanture"
                name: "terrasse"
                widget: "image"
                required: false

              - label: "Photo miniature 1"
                name: "mini_1"
                widget: "image"
                required: false

              - label: "Photo miniature 2"
                name: "mini_2"
                widget: "image"
                required: false

              - label: "Photo enseigne / boutique"
                name: "enseigne"
                widget: "image"
                required: false

              - label: "Badge local artisanal"
                name: "badge"
                widget: "image"
                required: false

              - label: "Stand marché de Noël"
                name: "marche"
                widget: "image"
                required: false

          # ── Galerie photos ─────────────────────────────────────────────────
          - label: "Galerie photos"
            name: "galerie"
            widget: "list"
            label_singular: "Photo"
            summary: "{{fields.alt}}"
            hint: "Photos affichées dans la galerie défilante. Ajoutez-en autant que vous voulez."
            fields:
              - label: "Photo"
                name: "src"
                widget: "image"
              - label: "Description (texte alternatif)"
                name: "alt"
                widget: "string"
                hint: "Décrit la photo pour l'accessibilité et le référencement"

          # ── Presse & distinctions ──────────────────────────────────────────
          - label: "Articles & distinctions presse"
            name: "presse"
            widget: "list"
            label_singular: "Article"
            summary: "{{fields.titre}} ({{fields.date}})"
            hint: "Affiché sur la page Presse. Ajoutez autant d'articles que vous souhaitez."
            fields:
              - label: "Badge / Source"
                name: "badge"
                widget: "string"
                hint: "Ex : Presse, Lettre du Président de Région, Actualité"

              - label: "Type de badge (couleur)"
                name: "badge_type"
                widget: "select"
                options:
                  - { label: "Bleu — Presse", value: "presse" }
                  - { label: "Or — Institutionnel", value: "gold" }
                  - { label: "Vert — Actualité", value: "green" }

              - label: "Titre"
                name: "titre"
                widget: "string"

              - label: "Contenu"
                name: "contenu"
                widget: "text"

              - label: "Date"
                name: "date"
                widget: "string"
                hint: "Ex : 2025 ou Décembre 2024"

              - label: "Identifiant technique"
                name: "id"
                widget: "string"
                hint: "Ne pas modifier — identifiant unique interne"

          # ── Avis clients ───────────────────────────────────────────────────
          - label: "Avis clients"
            name: "avis"
            widget: "list"
            label_singular: "Avis"
            summary: "{{fields.auteur}}"
            hint: "Avis affichés sur la page d'accueil. Ajoutez ou supprimez librement."
            fields:
              - label: "Texte de l'avis"
                name: "texte"
                widget: "text"

              - label: "Auteur"
                name: "auteur"
                widget: "string"

              - label: "Source"
                name: "source"
                widget: "string"
                hint: "Ex : Avis Google"

              - label: "Identifiant technique"
                name: "id"
                widget: "string"
                hint: "Ne pas modifier — identifiant unique interne"

  # ─── RAYONS BOUTIQUE ─────────────────────────────────────────────────────
  - name: "rayons"
    label: "Rayons boutique"
    files:
      - name: "rayons"
        label: "Gérer les étagères"
        file: "data/rayons.json"
        format: json
        fields:
          - label: "Rayons"
            name: "rayons"
            widget: "list"
            label_singular: "Rayon"
            summary: "{{fields.nom}}"
            hint: "Ajoutez, supprimez ou réordonnez les rayons affichés sur les étagères de la boutique."
            fields:
              - label: "Identifiant (catégorie)"
                name: "id"
                widget: "select"
                options:
                  - { label: "Alcools & Champagnes", value: "alcools" }
                  - { label: "Autour de l'Olive", value: "autour-olive" }
                  - { label: "Bières", value: "bieres" }
                  - { label: "Biscuits Salés", value: "biscuits-sales" }
                  - { label: "Biscuits Sucrés", value: "biscuits-sucres" }
                  - { label: "Café, Thé & Infusions", value: "cafe-the" }
                  - { label: "Chocolat & Confiseries", value: "chocolat" }
                  - { label: "Confitures", value: "confitures" }
                  - { label: "Épices & Lavande", value: "epices" }
                  - { label: "Jus de Fruits", value: "jus" }
                  - { label: "Miel", value: "miel" }
                  - { label: "Pâtes, Riz & Ravioles", value: "pates-riz" }
                  - { label: "Plats Cuisinés", value: "plats-cuisines" }
                  - { label: "Sel de Camargue", value: "sel-camargue" }
                  - { label: "Sirops", value: "sirops" }
                  - { label: "Terrines & Charcuteries", value: "terrines" }
                  - { label: "Vins", value: "vins" }
              - label: "Nom affiché sur l'étagère"
                name: "nom"
                widget: "string"
              - label: "Icône (fichier SVG)"
                name: "icone"
                widget: "string"
                hint: "Nom du fichier dans assets/icons/ — ex : vins.svg"

  # ─── CATALOGUE PRODUITS ──────────────────────────────────────────────────
  - name: "catalogue"
    label: "Catalogue produits"
    files:
      - name: "produits"
        label: "Tous les produits"
        file: "data/catalogue.json"
        format: json
        preview_path: "boutique.html"
        fields:
          - label: "Produits"
            name: "produits"
            widget: "list"
            label_singular: "Produit"
            summary: "{{fields.nom}} — {{fields.categorie}}"
            fields:

              - label: "Catégorie"
                name: "categorie"
                widget: "select"
                options:
                  - { label: "Alcools & Champagnes", value: "alcools" }
                  - { label: "Autour de l'Olive", value: "autour-olive" }
                  - { label: "Bières", value: "bieres" }
                  - { label: "Biscuits Salés", value: "biscuits-sales" }
                  - { label: "Biscuits Sucrés", value: "biscuits-sucres" }
                  - { label: "Café, Thé & Infusions", value: "cafe-the" }
                  - { label: "Chocolat & Confiseries", value: "chocolat" }
                  - { label: "Confitures", value: "confitures" }
                  - { label: "Épices & Lavande", value: "epices" }
                  - { label: "Jus de Fruits", value: "jus" }
                  - { label: "Miel", value: "miel" }
                  - { label: "Pâtes, Riz & Ravioles", value: "pates-riz" }
                  - { label: "Plats Cuisinés", value: "plats-cuisines" }
                  - { label: "Sel de Camargue", value: "sel-camargue" }
                  - { label: "Sirops", value: "sirops" }
                  - { label: "Terrines & Charcuteries", value: "terrines" }
                  - { label: "Vins", value: "vins" }

              - label: "Nom du produit"
                name: "nom"
                widget: "string"

              - label: "Photo du produit"
                name: "image"
                widget: "image"
                required: false
                hint: "Photo affichée dans le catalogue"

              - label: "Description"
                name: "description"
                widget: "text"
                required: false
                hint: "Texte affiché au clic sur le produit"

              - label: "Légende de la photo"
                name: "legende"
                widget: "string"
                required: false
                hint: "Courte légende affichée sous la photo"

              - label: "Prix"
                name: "prix"
                widget: "string"
                required: false
                hint: "Ex : 4,50 €"

              - label: "Contenance / Poids"
                name: "contenance"
                widget: "string"
                required: false
                hint: "Ex : 250 g — 50 cL — 75 cL — 1 kg"

              - label: "Prix au détail"
                name: "prix_unitaire"
                widget: "string"
                required: false
                hint: "Ex : 1,80 € / 100g — 3,20 € / litre"

              - label: "Mise en avant (coups de cœur)"
                name: "best_seller"
                widget: "boolean"
                default: false
                hint: "Réservé pour usage futur — non affiché actuellement"

              - label: "Produit visible"
                name: "visible"
                widget: "boolean"
                default: true
                hint: "Décochez pour masquer ce produit sans le supprimer"

              - label: "ID technique"
                name: "id"
                widget: "string"
                hint: "Ne pas modifier — identifiant unique du produit"
