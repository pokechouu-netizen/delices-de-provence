<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mentions légales — Délices de Provence</title>
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
  <style>
    :root{--bg:#f8f5f0;--surface:#fff;--border:#e5ddd4;--primary:#c4913a;--text:#2c1810;--muted:#8b6e5a;--danger:#d94f4f;--success:#3a9a5c;--r:8px;--shadow:0 2px 8px rgba(44,24,16,.1)}
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:14px;background:var(--bg);color:var(--text);min-height:100vh}
    #loginScreen{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;gap:1rem}
    #loginScreen h1{font-size:1.3rem}
    #loginScreen p{color:var(--muted);font-size:.9rem}
    .btn-login{padding:.65rem 2rem;background:var(--primary);color:#fff;border:none;border-radius:var(--r);font-size:1rem;cursor:pointer}
    #adminScreen{display:none}
    .topbar{background:var(--surface);border-bottom:1px solid var(--border);padding:.65rem 1.25rem;display:flex;align-items:center;gap:.75rem;position:sticky;top:0;z-index:100;box-shadow:var(--shadow);flex-wrap:wrap}
    .topbar h1{font-size:1rem;font-weight:600;flex:1;min-width:120px}
    .status{font-size:.78rem;padding:.25rem .65rem;border-radius:50px}
    .status.saving{color:var(--primary);background:rgba(196,145,58,.12)}
    .status.saved{color:var(--success);background:rgba(58,154,92,.12)}
    .status.error{color:var(--danger);background:rgba(217,79,79,.12)}
    .content{max-width:700px;margin:0 auto;padding:1.5rem 1.25rem}
    .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:1.5rem;margin-bottom:1.25rem;box-shadow:var(--shadow)}
    .card__title{font-size:.95rem;font-weight:600;margin-bottom:1.25rem}
    .fg{display:flex;flex-direction:column;gap:.3rem;margin-bottom:.9rem}
    .fg label{font-size:.75rem;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
    .fg input,.fg textarea{padding:.48rem .65rem;border:1.5px solid var(--border);border-radius:6px;font-size:.9rem;font-family:inherit;outline:none;transition:border-color .2s;background:#fff;color:var(--text)}
    .fg input:focus,.fg textarea:focus{border-color:var(--primary)}
    .fg textarea{resize:vertical;min-height:80px;line-height:1.5}
    .frow{display:grid;grid-template-columns:1fr 1fr;gap:.75rem}
    .save-row{display:flex;justify-content:flex-end;padding-top:1rem;border-top:1px solid var(--border)}
    .btn{padding:.5rem 1.25rem;border:none;border-radius:var(--r);font-size:.88rem;font-weight:500;cursor:pointer;transition:opacity .15s}
    .btn:hover{opacity:.85}
    .btn-primary{background:var(--primary);color:#fff}
    .btn-ghost{background:transparent;border:1.5px solid var(--border);color:var(--text)}
    .btn-sm{padding:.28rem .65rem;font-size:.78rem}
    .btn-text{background:none;border:none;color:var(--muted);font-size:.8rem;cursor:pointer;text-decoration:underline}
  </style>
</head>
<body>

  <div id="loginScreen">
    <h1>Administration — Délices de Provence</h1>
    <p>Connectez-vous pour modifier les mentions légales</p>
    <button class="btn-login" onclick="netlifyIdentity.open()">Se connecter</button>
  </div>

  <div id="adminScreen">
    <div class="topbar">
      <h1>Mentions légales</h1>
      <span class="status" id="statusEl"></span>
      <a href="index.html" class="btn btn-ghost btn-sm">← Admin</a>
      <a href="../mentions-legales.html" target="_blank" class="btn btn-ghost btn-sm">Voir la page ↗</a>
      <button class="btn-text" onclick="netlifyIdentity.logout()">Déconnexion</button>
    </div>

    <div class="content">

      <!-- Éditeur -->
      <div class="card">
        <div class="card__title">🏢 Éditeur du site</div>
        <div class="frow">
          <div class="fg"><label>Enseigne</label><input type="text" id="e_enseigne"></div>
          <div class="fg"><label>Société</label><input type="text" id="e_societe"></div>
        </div>
        <div class="frow">
          <div class="fg"><label>Forme juridique</label><input type="text" id="e_forme"></div>
          <div class="fg"><label>Code APE</label><input type="text" id="e_ape"></div>
        </div>
        <div class="frow">
          <div class="fg"><label>SIREN</label><input type="text" id="e_siren"></div>
          <div class="fg"><label>SIRET</label><input type="text" id="e_siret"></div>
        </div>
        <div class="save-row"><button class="btn btn-primary" onclick="saveSection('editeur')">Enregistrer</button></div>
      </div>

      <!-- Coordonnées -->
      <div class="card">
        <div class="card__title">📍 Coordonnées</div>
        <div class="fg"><label>Adresse</label><input type="text" id="c_adresse"></div>
        <div class="frow">
          <div class="fg"><label>Téléphone</label><input type="text" id="c_tel"></div>
          <div class="fg"><label>Email</label><input type="email" id="c_email"></div>
        </div>
        <div class="save-row"><button class="btn btn-primary" onclick="saveSection('coordonnees')">Enregistrer</button></div>
      </div>

      <!-- Hébergement -->
      <div class="card">
        <div class="card__title">🌐 Hébergement</div>
        <div class="fg"><label>Hébergeur</label><input type="text" id="h_hebergeur"></div>
        <div class="fg"><label>Adresse</label><input type="text" id="h_adresse"></div>
        <div class="fg"><label>Site web</label><input type="text" id="h_site"></div>
        <div class="save-row"><button class="btn btn-primary" onclick="saveSection('hebergement')">Enregistrer</button></div>
      </div>

      <!-- Textes légaux -->
      <div class="card">
        <div class="card__title">📝 Textes légaux</div>
        <div class="fg"><label>Directrice de publication</label><textarea id="t_directrice" rows="2"></textarea></div>
        <div class="fg"><label>Propriété intellectuelle</label><textarea id="t_pi" rows="3"></textarea></div>
        <div class="fg"><label>Crédits — Conception</label><input type="text" id="t_conception"></div>
        <div class="fg"><label>Crédits — Photographies</label><input type="text" id="t_photos"></div>
        <div class="fg"><label>Crédits — Typographies</label><input type="text" id="t_typo"></div>
        <div class="fg"><label>Responsabilité (paragraphe 1)</label><textarea id="t_resp1" rows="3"></textarea></div>
        <div class="fg"><label>Responsabilité (paragraphe 2)</label><textarea id="t_resp2" rows="2"></textarea></div>
        <div class="fg"><label>Litiges</label><textarea id="t_litiges" rows="2"></textarea></div>
        <div class="save-row"><button class="btn btn-primary" onclick="saveSection('textes')">Enregistrer</button></div>
      </div>

    </div>
  </div>

  <script>
  (function(){
    'use strict';
    var GIT  = '/.netlify/git/github/contents/';
    var FILE = 'data/mentions.json';
    var data = {}, fileSha = '';

    netlifyIdentity.on('init',  function(u){ if(u) boot(); });
    netlifyIdentity.on('login', function(u){ netlifyIdentity.close(); boot(); });
    netlifyIdentity.on('logout', function(){
      document.getElementById('adminScreen').style.display='none';
      document.getElementById('loginScreen').style.display='flex';
    });

    function boot(){
      document.getElementById('loginScreen').style.display='none';
      document.getElementById('adminScreen').style.display='block';
      load();
    }

    function jwt(){ return netlifyIdentity.currentUser().jwt(); }

    function gitGet(p){
      return jwt().then(function(t){
        return fetch(GIT+p,{headers:{'Authorization':'Bearer '+t}})
          .then(function(r){ if(!r.ok) throw r.status; return r.json(); });
      });
    }
    function gitPut(p,b){
      return jwt().then(function(t){
        return fetch(GIT+p,{method:'PUT',headers:{'Content-Type':'application/json','Authorization':'Bearer '+t},body:JSON.stringify(b)})
          .then(function(r){ if(!r.ok) throw r.status; return r.json(); });
      });
    }

    function load(){
      st('saving','Chargement…');
      gitGet(FILE).then(function(d){
        fileSha = d.sha;
        data = JSON.parse(decodeURIComponent(escape(atob(d.content.replace(/\n/g,'')))));
        st('','');
        fill();
      }).catch(function(){ st('error','Erreur chargement'); });
    }

    function write(msg){
      st('saving','Enregistrement…');
      var c = btoa(unescape(encodeURIComponent(JSON.stringify(data,null,2))));
      return gitPut(FILE,{message:msg,sha:fileSha,content:c}).then(function(d){
        fileSha = d.content.sha;
        st('saved','Enregistré ✓');
        setTimeout(function(){ st('',''); },3000);
      }).catch(function(){ st('error','Erreur sauvegarde'); });
    }

    function fill(){
      var e = data.editeur || {};
      sv('e_enseigne', e.enseigne||''); sv('e_societe', e.societe||'');
      sv('e_forme', e.forme_juridique||''); sv('e_ape', e.code_ape||'');
      sv('e_siren', e.siren||''); sv('e_siret', e.siret||'');
      var c = data.coordonnees || {};
      sv('c_adresse', c.adresse||''); sv('c_tel', c.telephone||''); sv('c_email', c.email||'');
      var h = data.hebergement || {};
      sv('h_hebergeur', h.hebergeur||''); sv('h_adresse', h.adresse||''); sv('h_site', h.site||'');
      sv('t_directrice', data.directrice_publication||'');
      sv('t_pi', data.propriete_intellectuelle||'');
      var cr = data.credits || {};
      sv('t_conception', cr.conception||''); sv('t_photos', cr.photographies||''); sv('t_typo', cr.typographies||'');
      sv('t_resp1', data.responsabilite_1||''); sv('t_resp2', data.responsabilite_2||'');
      sv('t_litiges', data.litiges||'');
    }

    window.saveSection = function(section){
      if(section === 'editeur'){
        if(!data.editeur) data.editeur={};
        data.editeur.enseigne       = gv('e_enseigne');
        data.editeur.societe        = gv('e_societe');
        data.editeur.forme_juridique= gv('e_forme');
        data.editeur.code_ape       = gv('e_ape');
        data.editeur.siren          = gv('e_siren');
        data.editeur.siret          = gv('e_siret');
        write('Mise à jour éditeur');
      } else if(section === 'coordonnees'){
        if(!data.coordonnees) data.coordonnees={};
        data.coordonnees.adresse   = gv('c_adresse');
        data.coordonnees.telephone = gv('c_tel');
        data.coordonnees.email     = gv('c_email');
        write('Mise à jour coordonnées mentions');
      } else if(section === 'hebergement'){
        if(!data.hebergement) data.hebergement={};
        data.hebergement.hebergeur = gv('h_hebergeur');
        data.hebergement.adresse   = gv('h_adresse');
        data.hebergement.site      = gv('h_site');
        write('Mise à jour hébergement');
      } else if(section === 'textes'){
        data.directrice_publication  = gv('t_directrice');
        data.propriete_intellectuelle= gv('t_pi');
        if(!data.credits) data.credits={};
        data.credits.conception   = gv('t_conception');
        data.credits.photographies= gv('t_photos');
        data.credits.typographies = gv('t_typo');
        data.responsabilite_1     = gv('t_resp1');
        data.responsabilite_2     = gv('t_resp2');
        data.litiges              = gv('t_litiges');
        write('Mise à jour textes légaux');
      }
    };

    function st(type,msg){ var el=document.getElementById('statusEl'); el.className='status'+(type?' '+type:''); el.textContent=msg; }
    function gv(id){ return document.getElementById(id).value; }
    function sv(id,v){ var el=document.getElementById(id); if(el) el.value=v; }
  })();
  </script>
</body>
</html>
