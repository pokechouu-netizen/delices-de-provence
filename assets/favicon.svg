<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2C1810"/>
      <stop offset="100%" stop-color="#3D2317"/>
    </linearGradient>
    <linearGradient id="leaf" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8BA34E"/>
      <stop offset="100%" stop-color="#6B7F3B"/>
    </linearGradient>
  </defs>
  <!-- Fond rond -->
  <circle cx="32" cy="32" r="30" fill="url(#bg)"/>
  <circle cx="32" cy="32" r="28" fill="none" stroke="#C8963E" stroke-width="1.5" opacity=".6"/>
  <!-- Initiales DP -->
  <text x="32" y="40" text-anchor="middle" font-family="Georgia,serif" font-weight="bold" font-size="24" fill="#F5EDE0" letter-spacing="1">DP</text>
  <!-- Petite branche d'olivier en haut -->
  <path d="M22 14 Q32 8 42 14" stroke="#C8963E" stroke-width="1.2" fill="none" opacity=".7"/>
  <ellipse cx="27" cy="11.5" rx="4" ry="2.2" fill="url(#leaf)" opacity=".6" transform="rotate(-15 27 11.5)"/>
  <ellipse cx="37" cy="11.5" rx="4" ry="2.2" fill="url(#leaf)" opacity=".6" transform="rotate(15 37 11.5)"/>
  <circle cx="32" cy="10" r="1.5" fill="#6B7F3B" opacity=".5"/>
  <!-- Petite déco en bas -->
  <path d="M24 52 Q32 56 40 52" stroke="#C8963E" stroke-width="1" fill="none" opacity=".5"/>
