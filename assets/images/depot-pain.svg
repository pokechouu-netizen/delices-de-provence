<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f5ebe0"/>
      <stop offset="100%" stop-color="#e8d5c0"/>
    </linearGradient>
    <linearGradient id="bread1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d4a056"/>
      <stop offset="40%" stop-color="#c08c3e"/>
      <stop offset="100%" stop-color="#a87530"/>
    </linearGradient>
    <linearGradient id="bread2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dbb06a"/>
      <stop offset="50%" stop-color="#c9963e"/>
      <stop offset="100%" stop-color="#b07e2e"/>
    </linearGradient>
    <linearGradient id="basket" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8b6c4a"/>
      <stop offset="100%" stop-color="#6b4f30"/>
    </linearGradient>
    <linearGradient id="cloth" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff5eb"/>
      <stop offset="100%" stop-color="#f0e0cc"/>
    </linearGradient>
    <filter id="softShadow">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#2c1810" flood-opacity=".15"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#bg)"/>

  <!-- Subtle flour dust circles -->
  <circle cx="180" cy="120" r="40" fill="#fff" opacity=".12"/>
  <circle cx="620" cy="100" r="55" fill="#fff" opacity=".08"/>
  <circle cx="400" cy="80" r="30" fill="#fff" opacity=".1"/>
  <circle cx="700" cy="450" r="35" fill="#fff" opacity=".06"/>
  <circle cx="100" cy="400" r="25" fill="#fff" opacity=".08"/>

  <!-- Basket -->
  <g filter="url(#softShadow)">
    <ellipse cx="400" cy="420" rx="220" ry="45" fill="#6b4f30"/>
    <path d="M180,420 Q180,280 260,260 L540,260 Q620,280 620,420 Z" fill="url(#basket)"/>
    <!-- Basket weave lines -->
    <line x1="220" y1="290" x2="220" y2="410" stroke="#5a4028" stroke-width="1.5" opacity=".3"/>
    <line x1="270" y1="270" x2="270" y2="415" stroke="#5a4028" stroke-width="1.5" opacity=".3"/>
    <line x1="320" y1="262" x2="320" y2="418" stroke="#5a4028" stroke-width="1.5" opacity=".3"/>
    <line x1="370" y1="260" x2="370" y2="420" stroke="#5a4028" stroke-width="1.5" opacity=".3"/>
    <line x1="420" y1="260" x2="420" y2="420" stroke="#5a4028" stroke-width="1.5" opacity=".3"/>
    <line x1="470" y1="260" x2="470" y2="418" stroke="#5a4028" stroke-width="1.5" opacity=".3"/>
    <line x1="520" y1="265" x2="520" y2="415" stroke="#5a4028" stroke-width="1.5" opacity=".3"/>
    <line x1="570" y1="275" x2="570" y2="410" stroke="#5a4028" stroke-width="1.5" opacity=".3"/>
    <!-- Horizontal weave -->
    <line x1="185" y1="320" x2="615" y2="320" stroke="#5a4028" stroke-width="1.5" opacity=".25"/>
    <line x1="182" y1="360" x2="618" y2="360" stroke="#5a4028" stroke-width="1.5" opacity=".25"/>
    <line x1="183" y1="400" x2="617" y2="400" stroke="#5a4028" stroke-width="1.5" opacity=".25"/>
  </g>

  <!-- Cloth in basket -->
  <path d="M200,280 Q210,240 300,235 L500,235 Q590,240 600,280 Q580,260 400,255 Q220,260 200,280 Z" fill="url(#cloth)" opacity=".8"/>

  <!-- Baguette 1 - leaning left -->
  <g filter="url(#softShadow)" transform="rotate(-20, 320, 250)">
    <path d="M280,120 Q275,115 290,100 Q320,80 340,100 Q345,115 340,120 L330,260 Q310,270 290,260 Z" fill="url(#bread1)"/>
    <!-- Score marks -->
    <line x1="295" y1="130" x2="335" y2="125" stroke="#a87530" stroke-width="2" opacity=".5"/>
    <line x1="293" y1="160" x2="337" y2="155" stroke="#a87530" stroke-width="2" opacity=".5"/>
    <line x1="291" y1="190" x2="338" y2="185" stroke="#a87530" stroke-width="2" opacity=".5"/>
    <line x1="290" y1="220" x2="336" y2="215" stroke="#a87530" stroke-width="2" opacity=".5"/>
  </g>

  <!-- Baguette 2 - center -->
  <g filter="url(#softShadow)" transform="rotate(-5, 400, 250)">
    <path d="M375,100 Q370,90 385,75 Q405,60 420,75 Q425,90 420,100 L415,255 Q400,265 385,255 Z" fill="url(#bread2)"/>
    <line x1="383" y1="110" x2="417" y2="108" stroke="#b07e2e" stroke-width="2" opacity=".5"/>
    <line x1="382" y1="140" x2="418" y2="138" stroke="#b07e2e" stroke-width="2" opacity=".5"/>
    <line x1="381" y1="170" x2="418" y2="168" stroke="#b07e2e" stroke-width="2" opacity=".5"/>
    <line x1="383" y1="200" x2="417" y2="198" stroke="#b07e2e" stroke-width="2" opacity=".5"/>
  </g>

  <!-- Baguette 3 - leaning right -->
  <g filter="url(#softShadow)" transform="rotate(15, 480, 250)">
    <path d="M455,130 Q450,120 465,105 Q485,90 500,105 Q505,120 500,130 L495,260 Q480,270 465,260 Z" fill="url(#bread1)"/>
    <line x1="463" y1="140" x2="497" y2="138" stroke="#a87530" stroke-width="2" opacity=".5"/>
    <line x1="462" y1="170" x2="498" y2="168" stroke="#a87530" stroke-width="2" opacity=".5"/>
    <line x1="461" y1="200" x2="498" y2="198" stroke="#a87530" stroke-width="2" opacity=".5"/>
    <line x1="462" y1="230" x2="497" y2="228" stroke="#a87530" stroke-width="2" opacity=".5"/>
  </g>

  <!-- Round bread / boule -->
  <g filter="url(#softShadow)">
    <ellipse cx="350" cy="290" rx="55" ry="45" fill="#c9963e"/>
    <ellipse cx="350" cy="285" rx="50" ry="38" fill="#d4a656"/>
    <!-- Cross score -->
    <line x1="330" y1="270" x2="370" y2="300" stroke="#b8883a" stroke-width="2.5" opacity=".4"/>
    <line x1="370" y1="270" x2="330" y2="300" stroke="#b8883a" stroke-width="2.5" opacity=".4"/>
  </g>

  <!-- Wheat stalk decoration - left -->
  <g opacity=".35" transform="translate(100,200) rotate(-15)">
    <line x1="0" y1="200" x2="0" y2="0" stroke="#8b7355" stroke-width="2"/>
    <ellipse cx="-5" cy="30" rx="6" ry="14" fill="#c9a86c" transform="rotate(-20,-5,30)"/>
    <ellipse cx="5" cy="45" rx="6" ry="14" fill="#c9a86c" transform="rotate(20,5,45)"/>
    <ellipse cx="-5" cy="60" rx="6" ry="14" fill="#c9a86c" transform="rotate(-20,-5,60)"/>
    <ellipse cx="5" cy="75" rx="6" ry="14" fill="#c9a86c" transform="rotate(20,5,75)"/>
    <ellipse cx="0" cy="15" rx="5" ry="12" fill="#c9a86c"/>
  </g>

  <!-- Wheat stalk - right -->
  <g opacity=".35" transform="translate(680,180) rotate(10)">
    <line x1="0" y1="200" x2="0" y2="0" stroke="#8b7355" stroke-width="2"/>
    <ellipse cx="-5" cy="30" rx="6" ry="14" fill="#c9a86c" transform="rotate(-20,-5,30)"/>
    <ellipse cx="5" cy="45" rx="6" ry="14" fill="#c9a86c" transform="rotate(20,5,45)"/>
    <ellipse cx="-5" cy="60" rx="6" ry="14" fill="#c9a86c" transform="rotate(-20,-5,60)"/>
    <ellipse cx="5" cy="75" rx="6" ry="14" fill="#c9a86c" transform="rotate(20,5,75)"/>
    <ellipse cx="0" cy="15" rx="5" ry="12" fill="#c9a86c"/>
  </g>

  <!-- Text -->
  <text x="400" y="520" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="24" font-weight="600" fill="#6b4f30" letter-spacing="3">DÉPÔT DE PAIN</text>
  <text x="400" y="555" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="14" fill="#8b7355" font-style="italic">Frais chaque matin</text>
</svg>
